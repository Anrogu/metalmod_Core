spring:
  application:
    name: metalmod-core

  datasource:
    url: jdbc:postgresql://localhost:5432/metalmod_core
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}   # sin valor por defecto: en Docker llega por SPRING_DATASOURCE_PASSWORD
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'validate' porque Flyway es quien manda en el esquema, no Hibernate
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    session:
      timeout: 8h        # una jornada; despues hay que volver a iniciar sesion
      cookie:
        http-only: true  # el JavaScript no puede leer la cookie de sesion
        same-site: lax   # no se envia en peticiones desde otros sitios
        # secure: true   # ACTIVAR cuando el sistema se sirva por HTTPS